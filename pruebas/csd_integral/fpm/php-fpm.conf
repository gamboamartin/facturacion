; Exclusivamente para el namespace efímero. Nunca instalar en /etc/php.
[global]
pid = /run/php-fpm/qa.pid
error_log = /tmp/fpm-qa/error.log
daemonize = no
process_control_timeout = 5s

[csd-sintetico]
; El master se ejecuta sin root; no se modifica la identidad de ningún servicio.
user = 1000
group = 1000
listen = /run/php-fpm/qa.sock
listen.mode = 0600
pm = static
pm.max_children = 1
pm.max_requests = 8
request_terminate_timeout = 30s
request_slowlog_timeout = 0
catch_workers_output = yes
decorate_workers_output = no
clear_env = yes
chdir = /var/www/html/facturacion
security.limit_extensions = .php
env[QA_HOST_NET_NS] = $QA_HOST_NET_NS
env[OPENSSL_CONF] = /qa/openssl.cnf
php_admin_value[upload_tmp_dir] = /tmp/fpm-qa/uploads
php_admin_value[session.save_path] = /tmp/fpm-qa/sessions
