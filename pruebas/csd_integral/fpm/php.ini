; Perfil aislado. PHP_INI_SCAN_DIR debe estar vacío al iniciar FPM.
[PHP]
engine = On
expose_php = Off
memory_limit = 256M
max_execution_time = 25
max_input_time = 25
error_reporting = E_ALL
display_errors = Off
log_errors = On
error_log = /tmp/fpm-qa/php-error.log
allow_url_fopen = Off
allow_url_include = Off
file_uploads = On
upload_max_filesize = 2M
post_max_size = 8M
max_file_uploads = 2
cgi.fix_pathinfo = 0
session.auto_start = Off
session.use_strict_mode = On
disable_functions = shell_exec,exec,system,passthru,proc_open,popen,fsockopen,pfsockopen,stream_socket_client,curl_exec,curl_multi_exec,socket_create,socket_connect,ftp_connect
extension = mysqlnd
extension = pdo
extension = pdo_mysql
extension = mbstring
extension = dom
extension = xml
extension = xmlwriter
extension = xmlreader
extension = zip
extension = iconv
extension = fileinfo
extension = tokenizer
extension = ctype
extension = simplexml
pdo_mysql.default_socket = /run/mysqld/mysqld.sock
